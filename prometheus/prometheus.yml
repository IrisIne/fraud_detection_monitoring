global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: fraud-detector
    static_configs:
      - targets: [fraud-detector:8000]
  - job_name: score-writer
    static_configs:
      - targets: [score-writer:8001]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
